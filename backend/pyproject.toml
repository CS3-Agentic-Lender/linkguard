[project]
name = "linkguard-backend"
version = "0.1.0"
description = "FastAPI service that checks pasted links for LinkGuard."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "joblib>=1.6",
    "linkguard-features",
    # The model and scaler are saved by ml/ with joblib. Loading them needs the
    # same scikit-learn version that saved them, so this matches ml/uv.lock.
    "scikit-learn==1.9.1",
    # The reasons for each risky link come from SHAP's tree explainer (docs/adr/0004).
    # Pinned to the version in ml/uv.lock, so the backend and the training checks agree.
    "shap==0.54.1",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    # FastAPI's TestClient needs httpx.
    "httpx>=0.28",
    "pytest-cov>=6.0",
]

[tool.uv]
# Not an installable package: uv only manages the environment.
package = false

[tool.uv.sources]
linkguard-features = { path = "../ml/features", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Puts backend/ on the import path, so `from app...` works whether pytest
# runs from backend/ or from the repo root (`pytest backend/tests`).
pythonpath = ["."]
# Coverage prints on every run. `app` is named as a package rather than
# a folder, so it resolves the same way from either directory.
addopts = "--cov=app --cov-report=term-missing"
