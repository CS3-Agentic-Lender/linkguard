[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "linkguard-features"
version = "0.1.0"
description = "Shared hostname feature extractor for LinkGuard training and live scans."
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
# The package is this folder itself, so ml/ keeps importing it as `features`
# with no copy anywhere.
package-dir = {"features" = "."}
packages = ["features"]
