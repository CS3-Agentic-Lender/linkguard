[project]
name = "linkguard-ml"
version = "0.1.0"
description = "Dataset, feature engineering and model training for LinkGuard."
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=2.2",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[tool.uv]
# Not an installable package: uv only manages the environment.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Puts ml/ on the import path, so `from cleaning...` works whether pytest
# runs from ml/ or from the repo root (`pytest ml/tests`).
pythonpath = ["."]
# Coverage prints on every run. `cleaning` and `leakage` are named as packages rather than
# folders, so they resolve the same way from either directory.
addopts = "--cov=cleaning --cov=leakage --cov-report=term-missing"
