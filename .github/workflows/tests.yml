# Runs the tests on every PR into dev, so a broken change shows up red
# before review. Needs no secrets, no .env, no dataset and no model file:
# the tests build their own small made-up data.
name: Tests

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

env:
  UV_VERSION: 0.13.1

jobs:
  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: ml/uv.lock

      # Reads the version from ml/.python-version.
      - name: Install Python
        run: uv python install

      # --locked fails the job if uv.lock is out of date with pyproject.toml.
      - name: Install ml dependencies
        run: uv sync --locked

      # Coverage prints too: pytest's addopts in ml/pyproject.toml include it.
      - name: Run ml tests
        run: uv run --locked pytest

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Reads the version from backend/.python-version.
      - name: Install Python
        run: uv python install

      # --locked fails the job if uv.lock is out of date with pyproject.toml.
      - name: Install backend dependencies
        run: uv sync --locked

      - name: Run backend tests
        run: uv run --locked pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # The locked jsdom and Vitest need Node 22.22.2+ or 24.15.0+ (the engines
      # range in frontend/package.json); "24" installs the newest 24 release.
      - name: Install Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json says and fails if it is
      # out of date with package.json.
      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Check colour contrast
        run: npm run contrast

      - name: Build the frontend
        run: npm run build
